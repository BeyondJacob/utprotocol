[workspace]
resolver = "2"
members = [
    "crates/utp-core",
    "crates/utp-llm",
    "crates/utp-agent",
    "crates/utp-api",
    # "crates/utp-cache",
    # "crates/utp-metrics",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Jacob Owens"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
# Web framework
axum = "0.7"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
# Utilities
anyhow = "1.0"
thiserror = "1.0"
# Concurrency
dashmap = "6.0"
crossbeam = "0.8"
rayon = "1.10"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Metrics
prometheus = "0.13"
# Testing
criterion = "0.5"
