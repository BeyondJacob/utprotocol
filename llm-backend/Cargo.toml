[package]
name = "llm-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Server
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client for Ollama API
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# Environment variables
dotenvy = "0.15"

# Async traits
async-trait = "0.1"

# UTP Protocol
half = { version = "2.3", features = ["serde"] }  # f16 support with serde
dashmap = "5.5"           # Concurrent cache
bincode = "1.3"           # Binary serialization
crc32fast = "1.3"         # Checksums for protocol
rand = { version = "0.8", features = ["std_rng"] }  # For mock embeddings (fallback)

# Production improvements
governor = "0.6"          # Rate limiting
tracing = "0.1"           # Structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"              # Configuration files

# PDF processing and file uploads
pdf-extract = "0.7"       # PDF text extraction
tempfile = "3"            # Temporary file handling
bytes = "1"               # Byte operations
