[package]
name = "llm-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client for Ollama API
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1"
