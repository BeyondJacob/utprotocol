version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: utprotocol-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utprotocol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utprotocol_password}
      POSTGRES_DB: ${POSTGRES_DB:-utprotocol}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      # Backup directory (optional)
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utprotocol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - utprotocol-network
    restart: always
    # Production: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Rust Backend
  backend:
    build:
      context: ./llm-backend
      dockerfile: Dockerfile
    container_name: utprotocol-backend-prod
    environment:
      # Database configuration
      DATABASE_URL: postgres://${POSTGRES_USER:-utprotocol}:${POSTGRES_PASSWORD:-utprotocol_password}@postgres:5432/${POSTGRES_DB:-utprotocol}

      # Ollama configuration
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}

      # Groq API key (if using cloud provider)
      GROQ_API_KEY: ${GROQ_API_KEY}

      # Logging (production: info level)
      RUST_LOG: ${RUST_LOG:-info}

      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - utprotocol-network
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Production: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    # Production: Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js Frontend
  frontend:
    build:
      context: ./llm-frontend
      dockerfile: Dockerfile
    container_name: utprotocol-frontend-prod
    environment:
      # Backend API URL
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}

      # Node environment
      NODE_ENV: production

      # Disable telemetry
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - utprotocol-network
    restart: always
    # Production: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    # Production: Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local

networks:
  utprotocol-network:
    driver: bridge
